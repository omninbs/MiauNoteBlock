# WebNBS 配置文件
# 修改后需重启服务生效

# 服务器监听配置
server:
  # 监听 IP
  # - 0.0.0.0 : 公开服务, 接受任意IP访问 (公网模式)
  # - 127.0.0.1 : 仅本机访问 (本地开发模式)
  host: 0.0.0.0
  # 监听端口
  port: 8000

# 公开模式配置
# - true  : 公开为站点, 任何人可访问, 多用户可并发编辑自己的 NBS
# - false : 本地/受控模式, 仅受信任用户访问
public: true

# 隐私政策 (首次访问时强制同意)
privacy:
  # 是否启用隐私弹窗
  enabled: true
  # 隐私政策内容 (简短一句话)
  message: "本服务器不会上传您的NBS/MIDI文件，所有的都会在本地处理。"

# 版本更新提示：修改版本号或内容后，客户端会在下次访问时显示更新日志
release:
  version: "2.8.0"
  notes: |
    2.8.0更新：
    添加“音符触发时轨道高亮”功能，这是一个很好的视觉效果功能，你可以在设置中打开，默认关闭。
    优化弹窗窗口的布局UI
    添加导入MIDI时，音色拟合的音量设置，可单独设置每个音色的音量（不影响midi原音量，而是乘上音量比例系数）
    优化一些小性能问题
    修复在手机端上的工具栏UI错位问题
    优化UI文本文字和设置UI的排版
    修复已知BUG、优化使用体验（其实是忘记更新了啥了）

    2.7.2更新：
    添加了欢迎界面，打开后会显示欢迎界面，而不是默认新建工程
    
    2.7.1更新：
    添加了歌词设置功能，优化了部分UI    
    
    未来计划：推测新nbs格式：mnb，届时将抛弃nbs格式
    创造出自由度和兼容性极高的mnb格式
  
    2.7.0更新：
    底层大优化，优化了性能
    在设置中添加了FPS控制，可以指定FPS
    但不用担心能耗，当画面为静止状态或者无操作时，不会调用GPU绘画
    只有在必要时才绘画，不会消耗哪怕一点点的额外性能。
    按F3可以查看当前的绘画帧率，你会发现有时候是0（非必要时不刷新，这是正常的）！
  
    2.6.1更新：
    优化midi导入的音色拟合和延音音轨的默认配置
    默认配置会根据midi动态调整选项设置，来达到最优。
    我敢保证，这个自动调整选项的，比你手调要好上100倍，几乎不用手动调整了
    唯一要调整的是 音色拟合的“音符数量”，防止拟合组合音色太多而爆炸，自己研究吧。
    
    2.6.0更新：
    优化压缩算法，算法的优秀程度达到最高！
    默认是选择最好用的模型：存在感引擎
    通过在物理上分析1tick中，每个音符的存在感
    来删除存在感较低的音符，实现压缩。
    在大型NBS项目中实测压缩率维持在20%-60%，同时质量损失只有1%-10%
    耗时了1个月，才攻克了这个压缩算法，接下来就会优化UI体验和其他功能....

# 高级配置 (可选)
advanced:
  # 工作线程数 (当前版本使用内存会话, 强制单 worker 以保证多用户隔离)
  # 如需多 worker 并发, 需配合外部缓存(如 Redis) 存储会话
  workers: 1
  # 临时文件保留时间 (秒), 超时自动清理
  temp_cleanup_seconds: 3600
  # MIDI/NBS 文件最大大小 (MB)
  max_upload_size_mb: 50

soundfont:
  # SF3/SF2 音色文件下载链接 (支持 http/https 直链)
  # 文件格式: .sf3 (推荐, Vorbis 压缩, 体积小质量好) 或 .sf2 (未压缩 PCM)
  url: "https://lz.qaiu.top/parser?url=https://gameclicker.lanzouu.com/iKnGN40wbo9g"
  # 音色库名称 (仅用于显示, 如 "GeneralUser GS")
  name: "midi音色资源包"
# SEO 搜索引擎优化配置
# 这些值会作为 <meta> 标签写入首页 <head>, 供百度/Google/Bing 等搜索引擎
# 与 QQ/微信等社交平台分享卡片读取。留空即使用默认值 (下方已标注默认)。
# 修改后需重启服务生效。
seo:
  # 站点公开地址 (用于生成分享卡片的绝对链接, 如 https://example.com/)
  # 留空则分享卡片使用相对地址 (部分平台可能需要绝对地址才能显示图片)
  site_url: "https://webnbs.com"
  # SEO 标题 (浏览器标签 + 搜索结果标题 + 分享卡片标题)
  # 默认: NoteBlockWeb - 在线 Minecraft 音符盒 (NBS) 编曲编辑器
  title: "NoteBlockWeb 在线红石音乐编辑器"
  # SEO 描述 (搜索结果摘要 + 分享卡片描述), 建议 60~120 个字符
  # 默认: 免费在线 Minecraft 音符盒 (Note Block / NBS) 编曲工具：支持 NBS 导入导出、MIDI 导入、钢琴卷帘编辑、音色拟合与音频渲染，无需安装即可在浏览器中使用。
  description: "新一代NBS编辑器，在UI和功能上得到飞升，添加了更多功能，解决了传统nbs编辑器编曲效率低的问题，在这里，midi转nbs自带各种针对性优化 使其转换的nbs极致接近原曲，独特的音域替换音色算法和歌曲压缩算法，这是你见过最强的nbs编辑器，没有之一！！"
  # 搜索引擎关键词 (逗号分隔)。注意: 现在的搜索引擎已不依赖 keywords 决定排名,
  # 主要作用是对 HTML 进行语义标注。
  # 默认: Minecraft, 音符盒, Note Block, NBS, 编曲, 编辑器, 音乐制作, MIDI, 在线工具, Music, Editor, Note block music
  keywords: "Minecraft,nbs,Note Block Web,Note Block Studio,编曲,红石音乐,我的世界,midi,music,editor,在线工具,音乐制作,音符盒,Note Block"
