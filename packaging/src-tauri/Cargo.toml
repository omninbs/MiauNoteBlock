[package]
name = "miaunoteblock"
version = "1.0.0"
description = "MiauNoteBlock - Minecraft Note Block Studio"
authors = ["COM1919"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "miaunoteblock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 可执行文件名固定为 productName，避免产物名与打包脚本/AppxManifest 不一致
[[bin]]
name = "MiauNoteBlock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
